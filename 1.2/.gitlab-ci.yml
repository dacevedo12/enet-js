.node: &node
  image: node:12@sha256:02dee4fa1ef5483dbab3e85aca88eecd51818ec7a97dc521d938d4504fa5b5ec

.dev-only: &dev-only
  rules:
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'

.prod-only: &prod-only
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'

1.2:lint-code:
  <<: *dev-only
  <<: *node  
  script:
    - cd 1.2/
    - npm install
    - npm run lint-code
  stage: lint

1.2:lint-docs:
  <<: *dev-only
  <<: *node
  script:
    - cd 1.2/
    - npm install
    - npm run lint-docs
  stage: lint

1.2:publish:
  <<: *prod-only
  <<: *node
  script:
    - cd 1.2/
    - cp ../LICENSE.md ./
    - npm install
    - |
      if git diff "${CI_COMMIT_BEFORE_SHA}" package.json | grep '+  "version"'
      then
          npm config set -- "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" \
          &&  npm set unsafe-perm true \
          &&  npm publish --tag 1.2x
      else
          echo "Version didn't change, skipping publish..."
      fi
  stage: publish
