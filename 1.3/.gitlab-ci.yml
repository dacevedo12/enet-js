.node: &node
  image: node:12@sha256:02dee4fa1ef5483dbab3e85aca88eecd51818ec7a97dc521d938d4504fa5b5ec

.dev-only: &dev-only
  rules:
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'

1.3:lint-code:
  <<: *dev-only
  <<: *node  
  script:
    - cd 1.3/
    - npm install
    - npm run lint-code
  stage: lint

1.3:lint-docs:
  <<: *dev-only
  <<: *node
  script:
    - cd 1.3/
    - npm install
    - npm run lint-docs
  stage: lint
